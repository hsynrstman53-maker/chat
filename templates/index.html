<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پیام‌نگار ما</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0e1621; display: flex; flex-direction: column; }
  .header { background: #17212b; color: white; padding: 12px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
  .me { background: #2b5278; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
  .other { background: #182533; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .name { font-size: 11px; color: #6ab2f2; margin-bottom: 3px; font-weight: bold; }
  .input-box { background: #17212b; padding: 8px; display: flex; gap: 6px; flex-shrink: 0; }
  input { flex: 1; background: #242f3d; border: none; color: white; padding: 11px 14px; border-radius: 20px; outline: none; font-size: 14px; }
  input::placeholder { color: #708499; }
  button { background: #5288c1; color: white; border: none; padding: 11px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: bold; }
  button:active { background: #3d6b9e; }
</style>
</head>
<body>
  <div class="header">💬 پیام‌نگار ما</div>
  <div class="chat" id="chat"></div>
  <div class="input-box">
    <input type="text" id="text" placeholder="پیامت رو بنویس...">
    <button onclick="sendMsg()">➤</button>
  </div>

<script>
const MY_NAME = "حسین";

const chat = document.getElementById('chat');

function sendMsg() {
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  fetch('/send', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: MY_NAME, text: text})
  });
  document.getElementById('text').value = '';
}

function loadMsgs() {
  fetch('/messages').then(r => r.json()).then(data => {
    chat.innerHTML = '';
    data.forEach(m => {
      const div = document.createElement('div');
      const mine = (m.name === MY_NAME);
      div.className = 'msg ' + (mine ? 'me' : 'other');
      div.innerHTML = (mine ? '' : '<div class="name">' + m.name + '</div>') + m.text;
      chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
  });
}

setInterval(loadMsgs, 1500);
loadMsgs();

document.getElementById('text').addEventListener('keypress', e => {
  if (e.key === 'Enter') sendMsg();
});
</script>
</body>
</html>
